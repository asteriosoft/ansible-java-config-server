---
- name: Install lxml python module
  pip:
    name:
      - lxml

- name: Download jar file from artifactory repo "{{ java_app_artifactory_repo_name }}"
  maven_artifact:
    group_id: "{{ java_app_artifactory_group_id }}"
    artifact_id: "{{ java_app_name }}"
    repository_url: "{{ java_app_artifactory_url }}/artifactory/{{ java_app_artifactory_repo_name }}/"
    dest: "{{ java_app_home_dir }}/{{ java_app_name }}.new.jar"
    version: "{{ java_app_version }}"
    username: "{{ java_app_artifactory_user }}"
    password: "{{ java_app_artifactory_password }}"
    mode: 0644
    owner: "{{ java_app_user_name }}"
    group: "{{ java_app_user_name }}"